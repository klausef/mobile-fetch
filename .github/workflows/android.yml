name: Android APK

# Builds an installable debug APK for FETCH and uploads it as a workflow artifact.
#
# Setup: add a repository secret named VITE_CONVEX_URL
# (Settings → Secrets and variables → Actions) so the bundled app can reach
# the Convex deployment. The other env vars (VITE_VLY_*) are optional and the
# app works without them.

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify build secrets
        env:
          VITE_CONVEX_URL: ${{ secrets.VITE_CONVEX_URL }}
        run: |
          if [ -z "$VITE_CONVEX_URL" ]; then
            echo "::error title=Missing secret::Add a repository secret named VITE_CONVEX_URL (Settings -> Secrets and variables -> Actions) before building the APK."
            exit 1
          fi

      - name: Build web app
        run: bun run build
        env:
          VITE_CONVEX_URL: ${{ secrets.VITE_CONVEX_URL }}

      - name: Sync Capacitor Android project
        run: bunx cap sync android

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fetch-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
